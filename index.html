<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in to GigTax...</title>
  <script>
    // Forwards the Google OAuth fragment to the GigTax app.
    (function() {
      var hash = window.location.hash;
      if (hash && hash.length > 1) {
        window.location.replace('com.gigtax.app:/oauth2redirect' + hash);
      } else {
        document.getElementById('msg').textContent =
          'Sign-in did not complete. Please return to the GigTax app and try again.';
      }
    })();
  </script>
</head>
<body>
  <p id="msg">Signing you in to GigTax...</p>
</body>
</html>
